AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Catch-up da Sprint 2 da Trilha Foundation (Cognito, API, Lambdas, DynamoDB, S3 e SQS).

Parameters:
  AllowedOrigin:
    Type: String
    Description: Origem HTTPS do frontend autorizada no CORS.

Globals:
  Function:
    MemorySize: 256
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        DATA_SOURCE: dynamodb
        MARKETPLACE_TABLE_NAME: !Ref MarketplaceTable
  Api:
    TracingEnabled: true

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  MarketplaceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-marketplace"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ProductImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "residencia-fdn-images-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AllowedOrigin]
            AllowedMethods: [GET, PUT]
            AllowedHeaders: ["*"]
            MaxAge: 3600

  OrderDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-order-events-dlq"
      MessageRetentionPeriod: 1209600

  OrderQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-order-events"
      VisibilityTimeout: 90
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrderDeadLetterQueue.Arn
        maxReceiveCount: 3

  MarketplaceApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-rest-api"
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  CatalogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: residencia-fdn-catalog-api
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      CodeUri: ../../../backend/lambdas/01-catalog-backend-api-lambda/catalog-backend-api-lambda.zip
      Environment:
        Variables:
          PRODUCT_IMAGES_BUCKET: !Ref ProductImagesBucket
          UPLOAD_URL_TTL_SECONDS: "900"
          DOWNLOAD_URL_TTL_SECONDS: "3600"
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MarketplaceTable
        - S3CrudPolicy:
            BucketName: !Ref ProductImagesBucket
      Events:
        ListProducts:
          Type: Api
          Properties: { RestApiId: !Ref MarketplaceApi, Path: /products, Method: GET }
        CreateProduct:
          Type: Api
          Properties: { RestApiId: !Ref MarketplaceApi, Path: /products, Method: POST }
        UpdateProduct:
          Type: Api
          Properties: { RestApiId: !Ref MarketplaceApi, Path: "/products/{id}", Method: PUT }
        DeleteProduct:
          Type: Api
          Properties: { RestApiId: !Ref MarketplaceApi, Path: "/products/{id}", Method: DELETE }

  OrderApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: residencia-fdn-order-api
      Runtime: dotnet8
      Architectures: [arm64]
      Handler: Residencia.Foundation.Orders::Residencia.Foundation.Orders.Function::FunctionHandler
      CodeUri: ../../../backend/lambdas/02-order-backend-api-lambda/order-backend-api-lambda.zip
      Environment:
        Variables:
          ORDER_QUEUE_URL: !Ref OrderQueue
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MarketplaceTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt OrderQueue.QueueName
      Events:
        CreateOrder:
          Type: Api
          Properties: { RestApiId: !Ref MarketplaceApi, Path: /orders, Method: POST }
        ListBuyerOrders:
          Type: Api
          Properties: { RestApiId: !Ref MarketplaceApi, Path: /orders, Method: GET }
        ListSellerOrders:
          Type: Api
          Properties: { RestApiId: !Ref MarketplaceApi, Path: /seller/orders, Method: GET }

  OrderProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: residencia-fdn-order-processor
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      CodeUri: ../../../backend/lambdas/03-order-processor-lambda/order-processor-lambda.zip
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MarketplaceTable
      Events:
        OrderEvents:
          Type: SQS
          Properties:
            Queue: !GetAtt OrderQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]

Outputs:
  ApiUrl:
    Value: !Sub "https://${MarketplaceApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  MarketplaceTableName:
    Value: !Ref MarketplaceTable
  ProductImagesBucketName:
    Value: !Ref ProductImagesBucket
  OrderQueueUrl:
    Value: !Ref OrderQueue
